# Runs the agent Mon-Fri at the IST times below and saves the reports in the repo,
# so they show up in the app's "Scheduled reports" tab. GitHub cron uses UTC (IST = UTC+5:30)
# and can start a few minutes late at busy times.
name: Nifty agent schedule

on:
  schedule:
    - cron: "20 3 * * 1-5"   # 08:50 IST  pre_open
    - cron: "5 4 * * 1-5"    # 09:35 IST  intraday
    - cron: "0 6 * * 1-5"    # 11:30 IST  intraday
    - cron: "15 8 * * 1-5"   # 13:45 IST  closing
    - cron: "15 10 * * 1-5"  # 15:45 IST  post_close
  workflow_dispatch:          # "Run workflow" button for a manual run
    inputs:
      session:
        description: "pre_open / intraday / closing / post_close (blank = auto)"
        required: false

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick session from the schedule
        id: s
        run: |
          case "${{ github.event.schedule }}" in
            "20 3 * * 1-5")  echo "session=pre_open"   >> $GITHUB_OUTPUT ;;
            "5 4 * * 1-5"|"0 6 * * 1-5") echo "session=intraday" >> $GITHUB_OUTPUT ;;
            "15 8 * * 1-5")  echo "session=closing"    >> $GITHUB_OUTPUT ;;
            "15 10 * * 1-5") echo "session=post_close" >> $GITHUB_OUTPUT ;;
            *) echo "session=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT ;;
          esac
      - name: Run agent (fresh data every run)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ -n "${{ steps.s.outputs.session }}" ] && ARGS="--session ${{ steps.s.outputs.session }}"
          [ -n "$TELEGRAM_BOT_TOKEN" ] && ARGS="$ARGS --telegram"
          python agent.py $ARGS
      - name: Keep the last 60 reports and save them to the repo
        run: |
          ls -1t reports/*.md 2>/dev/null | tail -n +61 | sed 's/\.md$//' | while read f; do rm -f "$f".*; done
          git config user.name "nifty-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git commit -m "Report $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" || echo "nothing to commit"
          git push
